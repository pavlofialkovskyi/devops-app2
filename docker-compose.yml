services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
# we store the actual tables on the docker volume between the containers going up and down
    ports:
      - "5432:5432"


  minio:
    image: cgr.dev/chainguard/minio:latest
    environment:
      MINIO_ROOT_USER: local_dev_key
      MINIO_ROOT_PASSWORD: local_dev_secret
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  
      - "9001:9001"  



  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT_URL: http://minio:9000
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET}
      AWS_ACCESS_KEY_ID: local_dev_key
      AWS_SECRET_ACCESS_KEY: local_dev_secret
# both db and s3 are running not in LOCALHOST, but in Docker composer name network
    ports:
      - "5000:5000"
    depends_on:
      - db
      - minio

volumes:
  pgdata:
  minio_data: